name: Deploy Optimized Flutter Web to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Clean build cache
        run: flutter clean
      
      - name: Build optimized web app
        run: |
          flutter build web \
            --release \
            --wasm \
            --base-href "/Personal-Portfolio/" \
            --no-source-maps
      
      - name: Copy service worker and headers
        run: |
          cp web/service-worker.js build/web/
          cp web/.htaccess build/web/ || true
          cp web/_headers build/web/ || true
      
      - name: Create .nojekyll
        run: touch build/web/.nojekyll
      
      - name: Copy to docs folder
        run: |
          rm -rf docs
          cp -r build/web docs
      
      - name: Display build info
        run: |
          echo "📊 Build Statistics:"
          du -sh build/web
          echo "✅ Build completed successfully!"
      
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet docs/ || echo "has_changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push to docs
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs
          git commit -m "🚀 Deploy optimized build - Auto deployment [skip ci]"
          git push

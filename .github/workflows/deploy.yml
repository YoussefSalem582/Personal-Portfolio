name: Deploy Optimized Flutter Web to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Clean build cache
        run: flutter clean
      
      - name: Build optimized web app
        env:
          # Optional: set FORMSPREE_ENDPOINT and CONTACT_RECIPIENT_EMAIL in repo Secrets
          # to override values in lib/core/config/api_keys.dart for Pages builds.
          FORMSPREE_ENDPOINT: ${{ secrets.FORMSPREE_ENDPOINT }}
          CONTACT_RECIPIENT_EMAIL: ${{ secrets.CONTACT_RECIPIENT_EMAIL }}
        run: |
          EXTRA=""
          if [ -n "$FORMSPREE_ENDPOINT" ]; then
            EXTRA="$EXTRA --dart-define=FORMSPREE_ENDPOINT=$FORMSPREE_ENDPOINT"
          fi
          if [ -n "$CONTACT_RECIPIENT_EMAIL" ]; then
            EXTRA="$EXTRA --dart-define=CONTACT_RECIPIENT_EMAIL=$CONTACT_RECIPIENT_EMAIL"
          fi
          flutter build web \
            --release \
            --base-href "/Youssef-Hassan-Portfolio/" \
            --no-source-maps \
            $EXTRA
      
      - name: Copy service worker and headers
        run: |
          cp web/service-worker.js build/web/
          cp web/.htaccess build/web/ || true
          cp web/_headers build/web/ || true
      
      - name: Create .nojekyll
        run: touch build/web/.nojekyll
      
      - name: Display build info
        run: |
          echo "Build folder contents:"
          du -sh build/web
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

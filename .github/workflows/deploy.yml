name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ master, main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # API Keys file is now committed to the repository (Formspree endpoint is public)
      # No need to create it dynamically anymore
      - name: Verify API Keys exist
        run: |
          if [ ! -f lib/config/api_keys.dart ]; then
            echo "Error: lib/config/api_keys.dart not found!"
            exit 1
          fi
          echo "✅ API Keys file found"
          cat lib/config/api_keys.dart
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Build web
        run: flutter build web --release --base-href "/Personal-Portfolio/"
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
name: Deploy Flutter Web to Vercel

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Clean build cache
        run: flutter clean

      - name: Build optimized web app
        env:
          # Optional: FORMSPREE_ENDPOINT and CONTACT_RECIPIENT_EMAIL in repo Secrets.
          FORMSPREE_ENDPOINT: ${{ secrets.FORMSPREE_ENDPOINT }}
          CONTACT_RECIPIENT_EMAIL: ${{ secrets.CONTACT_RECIPIENT_EMAIL }}
          # Optional: override canonical URL for dart-define (defaults below).
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          EXTRA=""
          if [ -n "$FORMSPREE_ENDPOINT" ]; then
            EXTRA="$EXTRA --dart-define=FORMSPREE_ENDPOINT=$FORMSPREE_ENDPOINT"
          fi
          if [ -n "$CONTACT_RECIPIENT_EMAIL" ]; then
            EXTRA="$EXTRA --dart-define=CONTACT_RECIPIENT_EMAIL=$CONTACT_RECIPIENT_EMAIL"
          fi
          SITE="${SITE_BASE_URL:-https://youssef-salem-portfolio.vercel.app}"
          EXTRA="$EXTRA --dart-define=SITE_BASE_URL=$SITE"
          flutter build web \
            --release \
            --base-href "/" \
            --no-source-maps \
            $EXTRA

      - name: Copy service worker and headers
        run: |
          cp web/service-worker.js build/web/
          cp web/.htaccess build/web/ || true
          cp web/_headers build/web/ || true
          cp vercel.json build/web/

      - name: Display build info
        run: |
          echo "Build folder contents:"
          du -sh build/web

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          cd build/web
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"

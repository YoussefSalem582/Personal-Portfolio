name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ master, main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Create API Keys config
        run: |
          mkdir -p lib/config
          cat > lib/config/api_keys.dart << 'EOF'
          /// API Keys Configuration
          class ApiKeys {
            // EmailJS Configuration
            static const String emailJsServiceId = 'service_bgf2wpr';
            static const String emailJsTemplateId = 'template_bz5u3sw';
            static const String emailJsPublicKey = 'cZy6Pq5CsNS33aWbj';
            
            // Email recipient
            static const String recipientEmail = 'youssef.salem.hassan582@gmail.com';
          }
          EOF
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Build web
        run: flutter build web --release --base-href "/Personal-Portfolio/"
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
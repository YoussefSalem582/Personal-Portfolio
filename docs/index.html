  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0D1117 0%, #161B22 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0D1117 0%, #161B22 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #loading.fade-out {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    /* Animated background particles */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(93, 173, 226, 0.6);
      border-radius: 50%;
      animation: float 15s infinite ease-in-out;
    }

    .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; animation-duration: 12s; }
    .particle:nth-child(2) { left: 20%; top: 80%; animation-delay: 2s; animation-duration: 14s; }
    .particle:nth-child(3) { left: 60%; top: 30%; animation-delay: 4s; animation-duration: 16s; }
    .particle:nth-child(4) { left: 80%; top: 70%; animation-delay: 1s; animation-duration: 13s; }
    .particle:nth-child(5) { left: 40%; top: 60%; animation-delay: 3s; animation-duration: 15s; }
    .particle:nth-child(6) { left: 90%; top: 40%; animation-delay: 5s; animation-duration: 11s; }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) scale(1);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      50% {
        transform: translate(50px, -50px) scale(1.5);
        opacity: 0.8;
      }
      90% {
        opacity: 0.6;
      }
    }

    .logo-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin-bottom: 40px;
      animation: fadeInScale 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Outer rotating ring */
    .logo-ring {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: rgba(93, 173, 226, 0.6);
      border-right-color: rgba(93, 173, 226, 0.4);
      animation: rotate 3s linear infinite;
    }

    .logo-ring-2 {
      position: absolute;
      width: 160px;
      height: 160px;
      top: 10px;
      left: 10px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: rgba(52, 152, 219, 0.4);
      border-left-color: rgba(52, 152, 219, 0.3);
      animation: rotate 4s linear infinite reverse;
    }

    .logo-circle {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3498DB 0%, #5DADE2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 
        0 0 60px rgba(52, 152, 219, 0.6),
        inset 0 0 30px rgba(255, 255, 255, 0.1);
      animation: pulse 2.5s ease-in-out infinite, glow 2s ease-in-out infinite;
      overflow: hidden;
    }

    .logo-image {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      animation: iconPulse 2s ease-in-out infinite;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.3));
    }

    .content-wrapper {
      text-align: center;
      animation: fadeInUp 1s cubic-bezier(0.4, 0, 0.2, 1) 0.4s both;
    }

    .name {
      color: #F0F6FC;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #F0F6FC 0%, #C9D1D9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeInUp 1s cubic-bezier(0.4, 0, 0.2, 1) 0.5s both, shimmer 3s ease-in-out infinite;
    }

    .title {
      color: #5DADE2;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 50px;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: fadeInUp 1s cubic-bezier(0.4, 0, 0.2, 1) 0.7s both;
    }

    /* Progress bar container */
    .progress-container {
      width: 280px;
      height: 4px;
      background: rgba(93, 173, 226, 0.2);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
      animation: fadeInUp 1s cubic-bezier(0.4, 0, 0.2, 1) 0.9s both;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3498DB, #5DADE2, #3498DB);
      background-size: 200% 100%;
      border-radius: 10px;
      animation: progressLoad 2s ease-in-out infinite, shimmerBar 2s linear infinite;
      box-shadow: 0 0 20px rgba(93, 173, 226, 0.6);
    }

    .loading-text {
      color: rgba(240, 246, 252, 0.7);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 2px;
      animation: fadeInUp 1s cubic-bezier(0.4, 0, 0.2, 1) 1.1s both, blink 2s ease-in-out infinite;
    }

    /* Dots animation */
    .loading-dots {
      display: inline-block;
      width: 30px;
      text-align: left;
    }

    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.5) rotate(-10deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    @keyframes glow {
      0%, 100% {
        box-shadow: 
          0 0 60px rgba(52, 152, 219, 0.6),
          inset 0 0 30px rgba(255, 255, 255, 0.1);
      }
      50% {
        box-shadow: 
          0 0 80px rgba(52, 152, 219, 0.9),
          inset 0 0 40px rgba(255, 255, 255, 0.2);
      }
    }

    @keyframes iconPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% center;
      }
      100% {
        background-position: 200% center;
      }
    }

    @keyframes shimmerBar {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    @keyframes progressLoad {
      0% {
        width: 0%;
      }
      50% {
        width: 70%;
      }
      100% {
        width: 100%;
      }
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    /* Light theme media query */
    @media (prefers-color-scheme: light) {
      body {
        background: linear-gradient(135deg, #F8F9FA 0%, #FFFFFF 100%);
      }
      #loading {
        background: linear-gradient(135deg, #F8F9FA 0%, #FFFFFF 100%);
      }
      .name {
        background: linear-gradient(135deg, #2C3E50 0%, #34495E 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .title {
        color: #3498DB;
      }
      .logo-circle {
        background: linear-gradient(135deg, #3498DB 0%, #2980B9 100%);
        box-shadow: 
          0 0 50px rgba(52, 152, 219, 0.4),
          inset 0 0 30px rgba(255, 255, 255, 0.2);
      }
      .logo-ring {
        border-top-color: rgba(52, 152, 219, 0.5);
        border-right-color: rgba(52, 152, 219, 0.3);
      }
      .logo-ring-2 {
        border-bottom-color: rgba(41, 128, 185, 0.4);
        border-left-color: rgba(41, 128, 185, 0.3);
      }
      .particle {
        background: rgba(52, 152, 219, 0.5);
      }
      .progress-container {
        background: rgba(52, 152, 219, 0.15);
      }
      .progress-bar {
        background: linear-gradient(90deg, #3498DB, #2980B9, #3498DB);
        box-shadow: 0 0 15px rgba(52, 152, 219, 0.5);
      }
      .loading-text {
        color: rgba(44, 62, 80, 0.7);
      }
      @keyframes glow {
        0%, 100% {
          box-shadow: 
            0 0 50px rgba(52, 152, 219, 0.4),
            inset 0 0 30px rgba(255, 255, 255, 0.2);
        }
        50% {
          box-shadow: 
            0 0 70px rgba(52, 152, 219, 0.6),
            inset 0 0 40px rgba(255, 255, 255, 0.3);
        }
      }
    }

    /* Responsive design */
    @media (max-width: 600px) {
      .logo-container {
        width: 140px;
        height: 140px;
      }
      .logo-ring {
        width: 140px;
        height: 140px;
      }
      .logo-ring-2 {
        width: 120px;
        height: 120px;
        top: 10px;
        left: 10px;
      }
      .logo-circle {
        width: 110px;
        height: 110px;
        top: 15px;
        left: 15px;
      }
      .logo-image {
        width: 90px;
        height: 90px;
      }
      .name {
        font-size: 26px;
      }
      .title {
        font-size: 15px;
      }
      .progress-container {
        width: 240px;
      }
    }
  </style>
</head>
<body>
  <!-- Loading Screen (Shown immediately while Flutter initializes) -->
  <div id="loading">
    <!-- Animated background particles -->
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <!-- Logo with rotating rings -->
    <div class="logo-container">
      <div class="logo-ring"></div>
      <div class="logo-ring-2"></div>
      <div class="logo-circle">
        <img src="assets/images/portfolio_logo.png" alt="Portfolio Logo" class="logo-image" />
      </div>
    </div>

    <!-- Content wrapper -->
    <div class="content-wrapper">
      <div class="name">Youssef Salem Hassan</div>
      <div class="title">Flutter Developer</div>
      
      <!-- Progress bar -->
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
      
      <!-- Loading text with animated dots -->
      <div class="loading-text">
        LOADING<span class="loading-dots"></span>
      </div>
    </div>
  </div>

  <script>
    // Remove loading screen when Flutter is ready with enhanced transition
    window.addEventListener('flutter-first-frame', function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('fade-out');
        setTimeout(() => loading.remove(), 800);
      }
    });

    // Fallback: Remove loading screen after 10 seconds if Flutter doesn't load
    setTimeout(function() {
      const loading = document.getElementById('loading');
      if (loading && !loading.classList.contains('fade-out')) {
        loading.classList.add('fade-out');
        setTimeout(() => loading.remove(), 800);
      }
    }, 10000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

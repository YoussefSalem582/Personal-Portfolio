  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0D1117 0%, #161B22 100%);
      overflow: hidden;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0D1117 0%, #161B22 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    #loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .logo-container {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 30px;
      animation: fadeInScale 1s ease-out;
    }

    .logo-circle {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3498DB 0%, #5DADE2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 40px rgba(52, 152, 219, 0.5);
      animation: pulse 2s ease-in-out infinite;
    }

    .logo-icon {
      font-size: 80px;
      color: white;
      font-weight: bold;
      font-family: 'Courier New', monospace;
    }

    .name {
      color: #F0F6FC;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 12px;
      letter-spacing: 1.2px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      animation: fadeInUp 1s ease-out 0.3s both;
    }

    .title {
      color: #5DADE2;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      animation: fadeInUp 1s ease-out 0.5s both;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(93, 173, 226, 0.3);
      border-top-color: #5DADE2;
      border-radius: 50%;
      animation: spin 1s linear infinite, fadeInUp 1s ease-out 0.7s both;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.5);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 40px rgba(52, 152, 219, 0.5);
      }
      50% {
        box-shadow: 0 0 60px rgba(52, 152, 219, 0.8);
      }
    }

    /* Light theme media query */
    @media (prefers-color-scheme: light) {
      body {
        background: linear-gradient(135deg, #F8F9FA 0%, #FFFFFF 100%);
      }
      #loading {
        background: linear-gradient(135deg, #F8F9FA 0%, #FFFFFF 100%);
      }
      .name {
        color: #2C3E50;
      }
      .title {
        color: #3498DB;
      }
      .logo-circle {
        background: linear-gradient(135deg, #3498DB 0%, #2980B9 100%);
        box-shadow: 0 0 40px rgba(52, 152, 219, 0.3);
      }
      @keyframes pulse {
        0%, 100% {
          box-shadow: 0 0 40px rgba(52, 152, 219, 0.3);
        }
        50% {
          box-shadow: 0 0 60px rgba(52, 152, 219, 0.5);
        }
      }
      .spinner {
        border-color: rgba(52, 152, 219, 0.3);
        border-top-color: #3498DB;
      }
    }
  </style>
</head>
<body>
  <!-- Loading Screen (Shown immediately while Flutter initializes) -->
  <div id="loading">
    <div class="logo-container">
      <div class="logo-circle">
        <div class="logo-icon">&lt;/&gt;</div>
      </div>
    </div>
    <div class="name">Youssef Salem Hassan</div>
    <div class="title">Flutter Developer</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Remove loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('fade-out');
        setTimeout(() => loading.remove(), 500);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

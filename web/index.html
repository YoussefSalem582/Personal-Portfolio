<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  
  <!-- DNS Prefetch for performance -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Youssef Hassan - Flutter Developer building fast cross-platform mobile and web apps. Expertise in Dart, Python, TensorFlow, Firebase, and machine learning integration.">
  <meta name="keywords" content="Flutter Developer, Mobile App Development, Cross-platform Apps, Dart, Python, TensorFlow, Firebase, Machine Learning, Web Development, Youssef Hassan">
  <meta name="author" content="Youssef Hassan">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://youssefsalem582.github.io/Personal-Portfolio/">
  
  <!-- Language and Localization -->
  <meta http-equiv="content-language" content="en">
  <meta name="language" content="English">
  <meta name="geo.region" content="GLOBAL">
  <meta name="geo.placename" content="Worldwide"
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Youssef Hassan - Flutter Developer Portfolio">
  <meta property="og:description" content="Flutter Developer building fast cross-platform mobile and web apps. Expertise in Dart, Python, TensorFlow, Firebase, and machine learning integration.">

  <meta property="og:site_name" content="Youssef Hassan Portfolio">
  <meta property="og:locale" content="en_US">
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Youssef Hassan - Flutter Developer Portfolio">
  <meta name="twitter:description" content="Flutter Developer building fast cross-platform mobile and web apps. Expertise in Dart, Python, TensorFlow, Firebase, and machine learning integration.">
  <meta name="twitter:image" content="https://youssefsalem582.github.io/Personal-Portfolio/assets/profile.jpeg">
  <meta name="twitter:creator" content="@YoussefSalem582">
  
  <!-- Additional Meta Tags -->
  <meta name="theme-color" content="#0D1117">
  <meta name="msapplication-TileColor" content="#0D1117">
  <meta name="msapplication-TileImage" content="icons/Icon-144.png">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Youssef Salem Hassan Portfolio">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>Youssef Salem Hassan - Portfolio</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Performance Optimization -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

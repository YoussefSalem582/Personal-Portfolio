<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Essential Meta Tags -->
  <meta name="description" content="Youssef Hassan - Flutter Developer Portfolio. Building fast cross-platform mobile and web apps with Flutter, Dart, Python, and machine learning integration.">
  <meta name="author" content="Youssef Hassan">
  <meta name="theme-color" content="#0D1117">
  <meta name="keywords" content="Flutter Developer, Mobile App Development, Web Development, Youssef Hassan, Dart, Python, Machine Learning">

  <!-- Open Graph Meta Tags (for social media sharing) -->
  <meta property="og:title" content="Youssef Hassan - Flutter Developer Portfolio">
  <meta property="og:description" content="Building fast cross-platform mobile and web apps with Flutter, Dart, Python, and machine learning integration.">
  <meta property="og:image" content="https://youssefsalem582.github.io/Youssef-Hassan-Portfolio/assets/assets/images/portfolio_logo.jpg">
  <meta property="og:url" content="https://youssefsalem582.github.io/Youssef-Hassan-Portfolio/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Youssef Hassan Portfolio">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Youssef Hassan - Flutter Developer Portfolio">
  <meta name="twitter:description" content="Building fast cross-platform mobile and web apps with Flutter, Dart, Python, and machine learning integration.">
  <meta name="twitter:image" content="https://youssefsalem582.github.io/Youssef-Hassan-Portfolio/assets/assets/images/portfolio_logo.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="favicon.jpg"/>
  <link rel="apple-touch-icon" href="favicon.jpg">

  <title>Youssef Hassan - Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0D1117;
      overflow: hidden;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0D1117;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #loading.fade-out {
      opacity: 0;
      transition: opacity 0.3s;
    }

    .content-wrapper {
      text-align: center;
    }

    .name {
      color: #F0F6FC;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .title {
      color: #8B949E;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      .name { font-size: 24px; }
      .title { font-size: 14px; }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading">
    <div class="content-wrapper">
      <div class="name">Youssef Hassan</div>
      <div class="title">Flutter Developer</div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('fade-out');
        setTimeout(function() { loading.remove(); }, 300);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
